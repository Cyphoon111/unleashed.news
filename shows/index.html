<link rel="stylesheet" href="/assets/site.css?v=4">
<style>
  .shows { max-width: var(--max); margin: 0 auto; padding: clamp(28px, 5vw, 56px) var(--gutter) 64px; }
  .shows__head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px 24px; margin-bottom: 22px; }
  .shows__head h1 { font-size: clamp(40px, 7vw, 72px); color: var(--ice); }
  .shows__count { font: 500 12px/1 var(--font-m); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  /* The player. Its controls live in a bar UNDER the picture, never over it: the bottom of every
     show is the studio banner (logo, book, QR), which overlaid browser controls would cover. */
  .player { position: relative; background: #000; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 40px 80px -40px rgba(232,16,127,.45); }
  .player__stage { position: relative; background: #000; }
  .player video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; cursor: pointer; }
  .player__big { position: absolute; inset: 0; margin: auto; width: 88px; height: 88px; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); background: rgba(6,6,11,.72); color: var(--ice); display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity .2s ease, transform .2s ease; }
  .player__big svg { width: 36px; height: 36px; margin-left: 4px; }
  .player__big:hover { transform: scale(1.06); border-color: var(--hot); }
  .player.is-playing .player__big { opacity: 0; pointer-events: none; transform: scale(.9); }
  /* Skip to the next show: bottom right of the picture, from the moment the rolling credits begin (Jason, 2026-10-28) */
  .player__skip { position: absolute; right: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 8px; padding: 11px 14px 11px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.3); background: rgba(6,6,11,.78); color: var(--ice); font: 700 12px/1 var(--font-m); letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: skipIn .35s ease; }
  .player__skip svg { width: 16px; height: 16px; fill: currentColor; }
  .player__skip:hover { border-color: var(--hot); background: rgba(232,16,127,.28); }
  .player__skip[hidden] { display: none; }
  @keyframes skipIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (max-width: 640px) { .player__skip { right: 8px; bottom: 8px; padding: 9px 11px 9px 13px; font-size: 11px; } }

  .player__controls { background: var(--panel); border-top: 1px solid var(--line); padding: 0 12px 8px; user-select: none; -webkit-user-select: none; }
  .scrub { position: relative; height: 22px; cursor: pointer; touch-action: none; }
  .scrub::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); }
  .scrub__buf, .scrub__played { position: absolute; left: 0; top: 9px; height: 4px; border-radius: 2px; width: 0; }
  .scrub__buf { background: rgba(255,255,255,.22); }
  .scrub__played { background: linear-gradient(90deg, var(--hot), var(--cyan)); }
  .scrub__knob { position: absolute; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--ice); box-shadow: 0 0 0 3px rgba(255,46,154,.35); transform: translateX(-50%) scale(0); transition: transform .15s ease; left: 0; }
  .scrub:hover .scrub__knob, .scrub:focus-visible .scrub__knob, .scrub.is-seeking .scrub__knob { transform: translateX(-50%) scale(1); }
  .scrub__tip { position: absolute; bottom: 24px; transform: translateX(-50%); padding: 4px 7px; border-radius: 6px; background: var(--ice); color: var(--ink); font: 700 11px/1 var(--font-m); opacity: 0; pointer-events: none; transition: opacity .12s ease; white-space: nowrap; }
  .scrub:hover .scrub__tip, .scrub.is-seeking .scrub__tip { opacity: 1; }
  .scrub:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; border-radius: 4px; }

  .player__row { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; }
  .player__group { display: flex; align-items: center; gap: 2px; }
  .pbtn { width: 40px; height: 40px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--ice); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .pbtn svg { width: 22px; height: 22px; fill: currentColor; }
  .pbtn:hover { background: rgba(255,255,255,.06); border-color: var(--line); }
  .pbtn:focus-visible { outline: 2px solid var(--hot); outline-offset: 1px; }
  .pbtn .alt, .player.is-playing .pbtn .base { display: none; }
  .player.is-playing .pbtn .alt { display: block; }
  .pbtn--mute .alt, .pbtn--mute .base { display: block; }
  .pbtn--mute .alt { display: none; }
  .player.is-muted .pbtn--mute .base { display: none; }
  .player.is-muted .pbtn--mute .alt { display: block; }
  .player__time { margin-left: 8px; font: 500 12px/1 var(--font-m); letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; }
  .player__time b { color: var(--ice); font-weight: 700; }
  .vol { width: 84px; height: 4px; margin: 0 8px 0 2px; accent-color: var(--hot); cursor: pointer; }
  .psel { font: 700 11px/1 var(--font-m); letter-spacing: 0.08em; color: var(--ice); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 10px; margin-right: 6px; cursor: pointer; -webkit-appearance: none; appearance: none; }
  .psel option { color: #000; }
  .player__quality { display: inline-flex; gap: 6px; margin-right: 6px; }
  .player__quality button { font: 700 11px/1 var(--font-m); letter-spacing: 0.1em; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 11px; cursor: pointer; }
  .player__quality button[aria-pressed="true"] { color: var(--ink); background: var(--ice); border-color: var(--ice); }
  .pbtn[hidden] { display: none; }

  .player__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 18px; padding: 14px 18px; background: var(--panel); border-top: 1px solid var(--line); }
  .player__title { font: italic 900 clamp(20px, 3vw, 28px)/1 var(--font-d); color: var(--ice); text-transform: uppercase; }
  .player__meta { font: 500 12px/1.6 var(--font-m); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .player__meta b { color: var(--ice); font-weight: 700; }
  .player__blurb { padding: 0 18px 16px; font: 400 15px/1.6 var(--font-b); color: var(--txt); background: var(--panel); }

  /* full screen: the picture fills what the control bar leaves; the bar hides when the mouse rests */
  .player:fullscreen { display: flex; flex-direction: column; border: 0; border-radius: 0; background: #000; }
  .player:fullscreen .player__stage { flex: 1; min-height: 0; display: flex; }
  .player:fullscreen video { width: 100%; height: 100%; aspect-ratio: auto; object-fit: contain; }
  .player:fullscreen .player__bar, .player:fullscreen .player__blurb { display: none; }
  .player:fullscreen .player__controls { transition: opacity .25s ease; }
  .player:fullscreen.is-idle .player__controls { opacity: 0; }
  .player:fullscreen.is-idle, .player:fullscreen.is-idle video { cursor: none; }

  /* not ".grid": site.css uses that name for the page's absolute, full-bleed background pattern,
     and the list inherited it — sitting over the player and swallowing clicks on its controls */
  .shows__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin-top: 34px; }
  .card { display: block; text-decoration: none; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; transition: transform .25s ease, border-color .25s ease; }
  .card:hover { transform: translateY(-3px); border-color: rgba(232,16,127,.6); }
  .card[aria-current="true"] { border-color: var(--hot); }
  .card__img { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .card__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card__dur { position: absolute; right: 8px; bottom: 8px; font: 700 11px/1 var(--font-m); color: var(--ice); background: rgba(6,6,11,.8); padding: 5px 7px; border-radius: 6px; }
  .card__body { padding: 12px 14px 14px; }
  .card__title { font: italic 900 20px/1.05 var(--font-d); color: var(--ice); text-transform: uppercase; }
  .card__date { margin-top: 6px; font: 500 11px/1 var(--font-m); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  .empty { padding: 48px 0; text-align: center; font: 500 14px/1.6 var(--font-m); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .empty b { display: block; font: italic 900 clamp(28px, 5vw, 44px)/1 var(--font-d); color: var(--ice); margin-bottom: 10px; }
  @media (max-width: 640px) {
    .player__bar { padding: 12px 14px; }
    .player__controls { padding: 0 6px 6px; }
    .pbtn { width: 36px; height: 36px; }
    .vol { display: none; }                 /* a phone's own buttons set the volume; mute stays */
    .hd { display: none; }
    .psel { padding: 7px 8px; margin-right: 4px; }
    .player__quality { margin-right: 2px; }
    .player__quality button { padding: 7px 8px; }
    .player__time { margin-left: 4px; font-size: 11px; }
    .player__big { width: 68px; height: 68px; }
    .player__big svg { width: 28px; height: 28px; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <a class="top__brand" href="/" aria-label="Unleashed.news home">UNLEASHED<span>.NEWS</span></a>
  <p class="top__status"><i class="dot" aria-hidden="true"></i><span>From the studio</span><b>Shows</b></p>
  <a class="top__cta" href="/#alert">Get the first alert</a>
</header>

<main id="main" class="shows">
  <div class="shows__head">
    <h1>The <em>Shows</em></h1>
    <p class="shows__count" id="count"></p>
  </div>

  <section class="player" id="player" hidden>
    <div class="player__stage">
      <video id="video" playsinline preload="metadata" poster=""></video>
      <button class="player__big" id="big" type="button" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg></button>
      <button class="player__skip" id="skip" type="button" hidden><span>Skip to the next show</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14l10-7zm11 0h3v14h-3z"/></svg></button>
    </div>
    <div class="player__controls" id="controls">
      <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00">
        <div class="scrub__buf" id="buf"></div><div class="scrub__played" id="played"></div><div class="scrub__knob" id="knob"></div><div class="scrub__tip" id="tip">0:00</div>
      </div>
      <div class="player__row">
        <div class="player__group">
          <button class="pbtn" id="play" type="button" aria-label="Play">
            <svg class="base" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
            <svg class="alt" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
          </button>
          <button class="pbtn" id="back" type="button" aria-label="Back 10 seconds" title="Back 10 s (←)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/><text x="8.6" y="15.6" font-size="6.2" font-weight="700" font-family="JetBrains Mono, monospace">10</text></svg>
          </button>
          <button class="pbtn" id="fwd" type="button" aria-label="Forward 10 seconds" title="Forward 10 s (→)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2l5 4-5 4V7a5 5 0 1 0 5 5h2a7 7 0 1 1-7-7z"/><text x="8.6" y="15.6" font-size="6.2" font-weight="700" font-family="JetBrains Mono, monospace">10</text></svg>
          </button>
          <span class="player__time" id="time"><b>0:00</b> / 0:00</span>
        </div>
        <div class="player__group">
          <button class="pbtn pbtn--mute" id="mute" type="button" aria-label="Mute" title="Mute (m)">
            <svg class="base" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zm11.5 3a3.5 3.5 0 0 0-2-3.2v6.4a3.5 3.5 0 0 0 2-3.2zM12.5 4.2v2.1a6 6 0 0 1 0 11.4v2.1a8 8 0 0 0 0-15.6z"/></svg>
            <svg class="alt" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
          </button>
          <input class="vol" id="vol" type="range" min="0" max="1" step="0.02" value="1" aria-label="Volume">
          <select class="psel" id="speed" aria-label="Playback speed" title="Speed">
            <option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option>
          </select>
          <div class="player__quality" role="group" aria-label="Quality">
            <button type="button" data-q="720" aria-pressed="false">720p</button>
            <button type="button" data-q="1080" aria-pressed="true">1080p<span class="hd"> HD</span></button>
          </div>
          <button class="pbtn" id="pip" type="button" aria-label="Picture in picture" title="Picture in picture (p)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6h-2V5H5v14h6v2H5a2 2 0 0 1-2-2zm10 8h8v6h-8z"/></svg>
          </button>
          <button class="pbtn" id="full" type="button" aria-label="Full screen" title="Full screen (f)">
            <svg class="base" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg>
            <svg class="alt" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4v6H4V8h4V4zm4 0h2v4h4v2h-6zM4 14h6v6H8v-4H4zm10 0h6v2h-4v4h-2z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="player__bar">
      <div>
        <p class="player__title" id="ptitle"></p>
        <p class="player__meta" id="pmeta"></p>
      </div>
    </div>
    <p class="player__blurb" id="pblurb" hidden></p>
  </section>

  <div class="shows__grid" id="grid"></div>
  <p class="empty" id="empty" hidden><b>First show coming soon</b>Recorded in the studio. Published here first.</p>
</main>

<footer class="foot">
  <p class="foot__brand">UNLEASHED<span>.NEWS</span></p>
  <p class="foot__line">© <span id="year">2026</span> Unleashed.news · Breaking news. Before it breaks.</p>
</footer>

<script>
(() => {
  const MANIFEST = 'https://videos.unleashed.news/shows.json';
  const $ = (s) => document.querySelector(s);
  const video = $('#video'), player = $('#player'), grid = $('#grid'), empty = $('#empty');
  const fmtDur = (s) => { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h}h ${String(m).padStart(2, '0')}m` : m ? `${m} min` : `${s} s`; };
  const fmtDate = (iso) => new Date(iso).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  const clock = (t) => { t = Math.max(0, Math.floor(t || 0)); const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`; };
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  let shows = [], current = null, quality = store.get('unleashed-quality') || (matchMedia('(max-width: 900px)').matches ? '720' : '1080');

  function play(show, autoplay) {
    current = show;
    const t = video.currentTime, wasPlaying = !video.paused && !video.ended;
    video.poster = show.poster;
    video.src = show.sources[quality] || show.sources['720'];
    $('#ptitle').textContent = show.title;
    $('#pmeta').innerHTML = `<b>${fmtDate(show.publishAt)}</b> · ${fmtDur(show.duration)}`;
    const blurb = $('#pblurb'); blurb.textContent = show.blurb || ''; blurb.hidden = !show.blurb;
    player.hidden = false;
    document.querySelectorAll('.card').forEach((c) => c.setAttribute('aria-current', c.dataset.id === show.id ? 'true' : 'false'));
    document.querySelectorAll('.player__quality button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.q === quality ? 'true' : 'false'));
    const key = `unleashed-pos-${show.id}`;
    video.addEventListener('loadedmetadata', () => { const saved = Number(store.get(key) || 0); if (t > 0) video.currentTime = t; else if (saved > 20 && saved < show.duration - 30) video.currentTime = saved; if (autoplay || wasPlaying) video.play().catch(() => {}); }, { once: true });
    video.ontimeupdate = () => { paint(); paintSkip(); if (video.currentTime > 10) store.set(key, String(Math.floor(video.currentTime))); };
    history.replaceState(null, '', `#${show.id}`);
    document.title = `${show.title} — UNLEASHED.NEWS`;
    paint(); paintSkip();
  }
  // The channel's queue: the shows in the order listed. From the moment a show's rolling credits begin (creditsAt, noted by
  // the studio's record hook when it was recorded), a button at the bottom right offers the next show (Jason, 2026-10-28).
  const nextShow = () => { const i = shows.findIndex((s) => current && s.id === current.id); return shows.length > 1 && i >= 0 ? shows[(i + 1) % shows.length] : null; };
  function paintSkip() {
    const skip = $('#skip'), n = nextShow();
    skip.hidden = !(n && current && current.creditsAt > 0 && (video.currentTime || 0) >= current.creditsAt);
  }
  $('#skip').addEventListener('click', () => { const n = nextShow(); if (n) { video.currentTime = 0; play(n, true); } });
  video.addEventListener('ended', paintSkip);

  document.querySelectorAll('.player__quality button').forEach((b) => b.addEventListener('click', () => {
    quality = b.dataset.q; store.set('unleashed-quality', quality); if (current) play(current, false);
  }));

  // ---- the controls ----
  const scrub = $('#scrub'), played = $('#played'), buf = $('#buf'), knob = $('#knob'), tip = $('#tip'), timeEl = $('#time');
  const vol = $('#vol'), speed = $('#speed'), pipBtn = $('#pip'), fullBtn = $('#full');
  const dur = () => (isFinite(video.duration) && video.duration > 0 ? video.duration : (current ? current.duration : 0));
  let seeking = false;
  function paint() {
    const d = dur(), t = video.currentTime || 0, pct = d ? Math.min(100, (t / d) * 100) : 0;
    played.style.width = `${pct}%`; knob.style.left = `${pct}%`;
    scrub.setAttribute('aria-valuenow', String(Math.round(pct))); scrub.setAttribute('aria-valuetext', clock(t));
    timeEl.innerHTML = `<b>${clock(t)}</b> / ${clock(d)}`;
    let b = 0; for (let i = 0; i < video.buffered.length; i++) if (video.buffered.start(i) <= t + 0.5) b = Math.max(b, video.buffered.end(i));
    buf.style.width = d ? `${Math.min(100, (b / d) * 100)}%` : '0';
  }
  const toggle = () => { if (!current) return; if (video.paused || video.ended) video.play().catch(() => {}); else video.pause(); };
  const seekBy = (s) => { video.currentTime = Math.max(0, Math.min(dur(), (video.currentTime || 0) + s)); paint(); };
  const frac = (e) => { const r = scrub.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); };
  $('#play').addEventListener('click', toggle);
  $('#big').addEventListener('click', toggle);
  video.addEventListener('click', toggle);
  video.addEventListener('dblclick', () => fullBtn.click());
  $('#back').addEventListener('click', () => seekBy(-10));
  $('#fwd').addEventListener('click', () => seekBy(10));
  video.addEventListener('play', () => { player.classList.add('is-playing'); $('#play').setAttribute('aria-label', 'Pause'); $('#big').setAttribute('aria-label', 'Pause'); });
  video.addEventListener('pause', () => { player.classList.remove('is-playing'); $('#play').setAttribute('aria-label', 'Play'); $('#big').setAttribute('aria-label', 'Play'); });
  video.addEventListener('ended', () => { player.classList.remove('is-playing'); paint(); });
  video.addEventListener('progress', paint);
  video.addEventListener('loadedmetadata', paint);
  video.addEventListener('durationchange', paint);

  // scrubber: drag anywhere on it; hover shows the time under the pointer
  scrub.addEventListener('pointerdown', (e) => { seeking = true; scrub.classList.add('is-seeking'); scrub.setPointerCapture(e.pointerId); video.currentTime = frac(e) * dur(); paint(); });
  scrub.addEventListener('pointermove', (e) => { const f = frac(e); tip.style.left = `${f * 100}%`; tip.textContent = clock(f * dur()); if (seeking) { video.currentTime = f * dur(); paint(); } });
  const endSeek = (e) => { if (!seeking) return; seeking = false; scrub.classList.remove('is-seeking'); try { scrub.releasePointerCapture(e.pointerId); } catch {} };
  scrub.addEventListener('pointerup', endSeek); scrub.addEventListener('pointercancel', endSeek);
  scrub.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { seekBy(-5); e.preventDefault(); } if (e.key === 'ArrowRight') { seekBy(5); e.preventDefault(); } });

  // volume and mute, remembered
  const paintVol = () => { player.classList.toggle('is-muted', video.muted || video.volume === 0); vol.value = video.muted ? 0 : video.volume; $('#mute').setAttribute('aria-label', video.muted ? 'Unmute' : 'Mute'); };
  video.volume = Math.max(0, Math.min(1, Number(store.get('unleashed-vol') ?? 1)));
  video.muted = store.get('unleashed-muted') === '1';
  vol.addEventListener('input', () => { video.volume = Number(vol.value); video.muted = video.volume === 0; store.set('unleashed-vol', vol.value); store.set('unleashed-muted', video.muted ? '1' : '0'); paintVol(); });
  $('#mute').addEventListener('click', () => { video.muted = !video.muted; if (!video.muted && video.volume === 0) video.volume = 0.6; store.set('unleashed-muted', video.muted ? '1' : '0'); paintVol(); });
  video.addEventListener('volumechange', paintVol);
  paintVol();

  // speed, remembered
  speed.value = store.get('unleashed-speed') || '1';
  video.playbackRate = Number(speed.value);
  speed.addEventListener('change', () => { video.playbackRate = Number(speed.value); store.set('unleashed-speed', speed.value); });
  video.addEventListener('loadedmetadata', () => { video.playbackRate = Number(speed.value); });

  // picture in picture, where the browser offers it
  if (!document.pictureInPictureEnabled || !video.requestPictureInPicture) pipBtn.hidden = true;
  pipBtn.addEventListener('click', async () => { try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await video.requestPictureInPicture(); } catch {} });

  // full screen: the whole player (picture + bar); iPhone Safari only offers the video's own
  const canFull = !!(player.requestFullscreen || player.webkitRequestFullscreen);
  fullBtn.addEventListener('click', () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    if (canFull) (player.requestFullscreen || player.webkitRequestFullscreen).call(player).catch?.(() => {});
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
  });
  const paintFull = () => { const on = !!(document.fullscreenElement || document.webkitFullscreenElement); player.classList.toggle('is-full', on); fullBtn.setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen'); fullBtn.querySelector('.base').style.display = on ? 'none' : ''; fullBtn.querySelector('.alt').style.display = on ? 'block' : ''; if (!on) player.classList.remove('is-idle'); };
  document.addEventListener('fullscreenchange', paintFull); document.addEventListener('webkitfullscreenchange', paintFull);
  let idle; const wake = () => { player.classList.remove('is-idle'); clearTimeout(idle); if (document.fullscreenElement && !video.paused) idle = setTimeout(() => player.classList.add('is-idle'), 2800); };
  player.addEventListener('pointermove', wake); player.addEventListener('pointerdown', wake); video.addEventListener('pause', wake);

  // keys, when the focus is not in a field: space/k play, ← → 10 s, j/l 10 s, ↑ ↓ volume, m mute, f full screen, p picture in picture
  document.addEventListener('keydown', (e) => {
    if (player.hidden || e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea' || e.target.isContentEditable) return;
    if (e.target === scrub && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
    const k = e.key;
    if (k === ' ' || k === 'k') toggle();
    else if (k === 'ArrowLeft' || k === 'j') seekBy(-10);
    else if (k === 'ArrowRight' || k === 'l') seekBy(10);
    else if (k === 'ArrowUp') { video.muted = false; video.volume = Math.min(1, video.volume + 0.1); store.set('unleashed-vol', String(video.volume)); }
    else if (k === 'ArrowDown') { video.volume = Math.max(0, video.volume - 0.1); store.set('unleashed-vol', String(video.volume)); }
    else if (k === 'm') $('#mute').click();
    else if (k === 'f') fullBtn.click();
    else if (k === 'p') { if (!pipBtn.hidden) pipBtn.click(); }
    else return;
    e.preventDefault();
  });

  function render() {
    const now = new Date().toISOString();
    const live = shows.filter((s) => s.publishAt <= now).sort((a, b) => (a.publishAt < b.publishAt ? 1 : -1));
    $('#count').textContent = live.length ? `${live.length} show${live.length === 1 ? '' : 's'}` : '';
    grid.innerHTML = live.map((s) => `
      <a class="card" href="#${s.id}" data-id="${s.id}" aria-current="false">
        <div class="card__img"><img src="${s.thumb}" alt="" loading="lazy"><span class="card__dur">${fmtDur(s.duration)}</span></div>
        <div class="card__body"><p class="card__title">${s.title}</p><p class="card__date">${fmtDate(s.publishAt)}</p></div>
      </a>`).join('');
    empty.hidden = live.length > 0;
    grid.querySelectorAll('.card').forEach((c) => c.addEventListener('click', (e) => { e.preventDefault(); play(live.find((s) => s.id === c.dataset.id), true); player.scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
    const wanted = location.hash.slice(1);
    const first = live.find((s) => s.id === wanted) || live[0];
    if (first) play(first, false);
  }

  fetch(MANIFEST, { cache: 'no-store' }).then((r) => r.ok ? r.json() : { shows: [] }).then((m) => { shows = m.shows || []; render(); }).catch(() => { empty.hidden = false; });
  const year = $('#year'); if (year) year.textContent = String(new Date().getFullYear());
})();
</script>
</body>
</html>
